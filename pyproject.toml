[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "DataOpsClasses"
version = "0.1.0"
description = "Biblioteca para manipulação de dados com o HBase"
licence = "LICENCE"
readme = "README.md"
authors = [
    {name = "Leonardo Jeronimo", email = "leonardo.silva@activebi.com.br"}
]
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.0",
    "happybase>=1.3.0",
    "SQLAlchemy"
]

[tool.setuptools.packages.find]
where = ["src"]
